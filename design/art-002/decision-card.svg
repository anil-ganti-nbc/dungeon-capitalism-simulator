<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1130" viewBox="0 0 960 1130" role="img" aria-label="decision-card"><title>decision-card</title><rect x="0" y="0" width="960" height="1130" rx="0" fill="#F7EFDC" stroke="none" stroke-width="1"/><rect x="0" y="0" width="960" height="24" rx="0" fill="#272A2D" stroke="none" stroke-width="1"/><text x="480.0" y="16" font-family="Arial" font-size="11" font-weight="700" fill="#F7EFDC" text-anchor="middle">CONCEPT ONLY · NOT IN GAME</text><text x="32" y="70" font-family="Georgia" font-size="29" font-weight="700" fill="#272A2D" text-anchor="start">The choice is between three working systems.</text><text x="32" y="104" font-family="Arial" font-size="19" font-weight="700" fill="#272A2D" text-anchor="start">Recommendation: A / The Counterfeit Ledger. No direction is selected yet.</text><text x="32" y="145" font-family="Arial" font-size="14" font-weight="700" fill="#595C59" text-anchor="start">DESIGN JUDGEMENT · 1 = WEAK, 5 = STRONG · NOT A USABILITY TEST</text><rect x="32" y="188" width="896" height="44" rx="0" fill="#E9DEBF" stroke="none" stroke-width="1"/><text x="48" y="214" font-family="Arial" font-size="18" font-weight="400" fill="#272A2D" text-anchor="start">Thumb usability</text><text x="650" y="214" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">4</text><text x="755" y="214" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">4</text><text x="860" y="214" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">4</text><rect x="32" y="232" width="896" height="44" rx="0" fill="#F7EFDC" stroke="none" stroke-width="1"/><text x="48" y="258" font-family="Arial" font-size="18" font-weight="400" fill="#272A2D" text-anchor="start">Information hierarchy</text><text x="650" y="258" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">5</text><text x="755" y="258" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">4</text><text x="860" y="258" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">4</text><rect x="32" y="276" width="896" height="44" rx="0" fill="#E9DEBF" stroke="none" stroke-width="1"/><text x="48" y="302" font-family="Arial" font-size="18" font-weight="400" fill="#272A2D" text-anchor="start">Lower production cost</text><text x="650" y="302" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">5</text><text x="755" y="302" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">3</text><text x="860" y="302" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">4</text><rect x="32" y="320" width="896" height="44" rx="0" fill="#F7EFDC" stroke="none" stroke-width="1"/><text x="48" y="346" font-family="Arial" font-size="18" font-weight="400" fill="#272A2D" text-anchor="start">Offline asset economy</text><text x="650" y="346" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">5</text><text x="755" y="346" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">4</text><text x="860" y="346" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">5</text><rect x="32" y="364" width="896" height="44" rx="0" fill="#E9DEBF" stroke="none" stroke-width="1"/><text x="48" y="390" font-family="Arial" font-size="18" font-weight="400" fill="#272A2D" text-anchor="start">Large / XLarge legibility</text><text x="650" y="390" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">5</text><text x="755" y="390" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">4</text><text x="860" y="390" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">4</text><rect x="32" y="408" width="896" height="44" rx="0" fill="#F7EFDC" stroke="none" stroke-width="1"/><text x="48" y="434" font-family="Arial" font-size="18" font-weight="400" fill="#272A2D" text-anchor="start">Colourblind clarity</text><text x="650" y="434" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">5</text><text x="755" y="434" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">4</text><text x="860" y="434" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">5</text><rect x="32" y="452" width="896" height="44" rx="0" fill="#E9DEBF" stroke="none" stroke-width="1"/><text x="48" y="478" font-family="Arial" font-size="18" font-weight="400" fill="#272A2D" text-anchor="start">Strictly 2D fidelity</text><text x="650" y="478" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">5</text><text x="755" y="478" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">5</text><text x="860" y="478" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">5</text><rect x="32" y="496" width="896" height="44" rx="0" fill="#F7EFDC" stroke="none" stroke-width="1"/><text x="48" y="522" font-family="Arial" font-size="18" font-weight="400" fill="#272A2D" text-anchor="start">Cynical merchant humour</text><text x="650" y="522" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">5</text><text x="755" y="522" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">4</text><text x="860" y="522" font-family="Arial" font-size="20" font-weight="700" fill="#272A2D" text-anchor="middle">3</text><text x="650" y="178" font-family="Arial" font-size="22" font-weight="700" fill="#272A2D" text-anchor="middle">A</text><text x="755" y="178" font-family="Arial" font-size="22" font-weight="700" fill="#272A2D" text-anchor="middle">B</text><text x="860" y="178" font-family="Arial" font-size="22" font-weight="700" fill="#272A2D" text-anchor="middle">C</text><text x="32" y="617" font-family="Arial" font-size="19" font-weight="700" fill="#272A2D" text-anchor="start">A / COUNTERFEIT LEDGER — strongest fit</text><text x="32" y="647" font-family="Arial" font-size="17" font-weight="400" fill="#272A2D" text-anchor="start">The receipt rules make the 185g quote and warranty easy to find; the</text><text x="32" y="670" font-family="Arial" font-size="17" font-weight="400" fill="#272A2D" text-anchor="start">chicken / plate drawing stays readable without becoming the whole screen.</text><text x="32" y="693" font-family="Arial" font-size="17" font-weight="400" fill="#272A2D" text-anchor="start">The XLarge workshop retains all six slots at 21px. Failure mode: paperwork</text><text x="32" y="716" font-family="Arial" font-size="17" font-weight="400" fill="#272A2D" text-anchor="start">can overwhelm the shop; keep the counter strip short and the account names bold.</text><text x="32" y="760" font-family="Arial" font-size="19" font-weight="700" fill="#272A2D" text-anchor="start">B / LANTERN &amp; SILHOUETTE — strongest atmosphere</text><text x="32" y="790" font-family="Arial" font-size="17" font-weight="400" fill="#272A2D" text-anchor="start">The opposing cut-paper profiles make the shop feel inhabited immediately.</text><text x="32" y="813" font-family="Arial" font-size="17" font-weight="400" fill="#272A2D" text-anchor="start">The pale outcome badge reads clearly, but the dark room needs more edge</text><text x="32" y="836" font-family="Arial" font-size="17" font-weight="400" fill="#272A2D" text-anchor="start">separation than A. Failure mode: silhouette details collapse into the wall;</text><text x="32" y="859" font-family="Arial" font-size="17" font-weight="400" fill="#272A2D" text-anchor="start">client profiles and room cutouts require more bespoke revision.</text><text x="32" y="903" font-family="Arial" font-size="19" font-weight="700" fill="#272A2D" text-anchor="start">C / POCKET WORKSHOP — strongest modular reuse</text><text x="32" y="933" font-family="Arial" font-size="17" font-weight="400" fill="#272A2D" text-anchor="start">Stepped frames and pixel props feel tactile; the same 19kg / 45kg facts</text><text x="32" y="956" font-family="Arial" font-size="17" font-weight="400" fill="#272A2D" text-anchor="start">remain live-sized UI text. Reusable tiles keep the future art budget small.</text><text x="32" y="979" font-family="Arial" font-size="17" font-weight="400" fill="#272A2D" text-anchor="start">Failure mode: tool-panel associations can overpower the merchant satire;</text><text x="32" y="1002" font-family="Arial" font-size="17" font-weight="400" fill="#272A2D" text-anchor="start">pixel art also needs strict scale discipline as catalogue content grows.</text><text x="32" y="1078" font-family="Arial" font-size="16" font-weight="400" fill="#272A2D" text-anchor="start">A0 fallback: remove portraits and the counter strip; preserve A’s type, receipt rules and labels.</text><text x="32" y="1106" font-family="Arial" font-size="15" font-weight="400" fill="#272A2D" text-anchor="start">Operator choice: A / B / C / none or revise. Independent acceptance + separate art authorisation still required.</text></svg>