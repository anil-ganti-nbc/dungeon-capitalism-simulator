<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1070" viewBox="0 0 960 1070" role="img" aria-label="asset-map"><title>asset-map</title><rect x="0" y="0" width="960" height="1070" rx="0" fill="#F7EFDC" stroke="none" stroke-width="1"/><rect x="0" y="0" width="960" height="24" rx="0" fill="#272A2D" stroke="none" stroke-width="1"/><text x="480.0" y="16" font-family="Arial" font-size="11" font-weight="700" fill="#F7EFDC" text-anchor="middle">CONCEPT ONLY · NOT IN GAME</text><text x="32" y="68" font-family="Georgia" font-size="29" font-weight="700" fill="#272A2D" text-anchor="start">Build the grammar. Author only the exceptions.</text><text x="32" y="103" font-family="Arial" font-size="18" font-weight="400" fill="#272A2D" text-anchor="start">Proposed future A slice · Estimates only · These mockups are not production assets</text><text x="32" y="155" font-family="Arial" font-size="18" font-weight="700" fill="#272A2D" text-anchor="start">EXISTING REACT / CSS / 2D CANVAS PRIMITIVES</text><text x="32" y="190" font-family="Arial" font-size="18" font-weight="400" fill="#272A2D" text-anchor="start">Typography and all gameplay values: semantic live text, never text in an image.</text><text x="32" y="219" font-family="Arial" font-size="18" font-weight="400" fill="#272A2D" text-anchor="start">Cards, receipt rules, state outlines, badges, slot rows and 48px touch regions.</text><text x="32" y="248" font-family="Arial" font-size="18" font-weight="400" fill="#272A2D" text-anchor="start">Plate rectangle, trigger arrows, three-room navigator and status overlays.</text><text x="32" y="277" font-family="Arial" font-size="18" font-weight="400" fill="#272A2D" text-anchor="start">Flat brick grid, workshop connectors and labelled geometric fallback actors.</text><text x="32" y="337" font-family="Arial" font-size="18" font-weight="700" fill="#272A2D" text-anchor="start">AUTHORED ART / ONE SHARED SLICE SET</text><text x="32" y="379" font-family="Arial" font-size="21" font-weight="700" fill="#272A2D" text-anchor="start">14</text><text x="88" y="379" font-family="Arial" font-size="18" font-weight="700" fill="#272A2D" text-anchor="start">Functional symbols</text><text x="365" y="379" font-family="Arial" font-size="16" font-weight="400" fill="#272A2D" text-anchor="start">24-unit vector grammar; reused everywhere</text><path d="M32 394H928" fill="none" stroke="#928777" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><text x="32" y="427" font-family="Arial" font-size="21" font-weight="700" fill="#272A2D" text-anchor="start">2</text><text x="88" y="427" font-family="Arial" font-size="18" font-weight="700" fill="#272A2D" text-anchor="start">Client medallions</text><text x="365" y="427" font-family="Arial" font-size="16" font-weight="400" fill="#272A2D" text-anchor="start">One existing master + one existing party</text><path d="M32 442H928" fill="none" stroke="#928777" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><text x="32" y="475" font-family="Arial" font-size="21" font-weight="700" fill="#272A2D" text-anchor="start">2</text><text x="88" y="475" font-family="Arial" font-size="18" font-weight="700" fill="#272A2D" text-anchor="start">Vignette strips</text><text x="365" y="475" font-family="Arial" font-size="16" font-weight="400" fill="#272A2D" text-anchor="start">Flat counter + workshop; optional in A0</text><path d="M32 490H928" fill="none" stroke="#928777" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><text x="32" y="523" font-family="Arial" font-size="21" font-weight="700" fill="#272A2D" text-anchor="start">3</text><text x="88" y="523" font-family="Arial" font-size="18" font-weight="700" fill="#272A2D" text-anchor="start">Replay tokens</text><text x="365" y="523" font-family="Arial" font-size="16" font-weight="400" fill="#272A2D" text-anchor="start">Party lead, chicken marker, spike payload</text><path d="M32 538H928" fill="none" stroke="#928777" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><text x="32" y="571" font-family="Arial" font-size="21" font-weight="700" fill="#272A2D" text-anchor="start">1</text><text x="88" y="571" font-family="Arial" font-size="18" font-weight="700" fill="#272A2D" text-anchor="start">Room frame</text><text x="365" y="571" font-family="Arial" font-size="16" font-weight="400" fill="#272A2D" text-anchor="start">One elevation reused across all three rooms</text><path d="M32 586H928" fill="none" stroke="#928777" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><text x="32" y="619" font-family="Arial" font-size="21" font-weight="700" fill="#272A2D" text-anchor="start">1</text><text x="88" y="619" font-family="Arial" font-size="18" font-weight="700" fill="#272A2D" text-anchor="start">Cellar motif</text><text x="365" y="619" font-family="Arial" font-size="16" font-weight="400" fill="#272A2D" text-anchor="start">No separate picture for every room</text><path d="M32 634H928" fill="none" stroke="#928777" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><text x="32" y="667" font-family="Arial" font-size="21" font-weight="700" fill="#272A2D" text-anchor="start">1</text><text x="88" y="667" font-family="Arial" font-size="18" font-weight="700" fill="#272A2D" text-anchor="start">Bottle motif</text><text x="365" y="667" font-family="Arial" font-size="16" font-weight="400" fill="#272A2D" text-anchor="start">Shared by variants; signature remains live text</text><path d="M32 682H928" fill="none" stroke="#928777" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><text x="32" y="757" font-family="Arial" font-size="18" font-weight="700" fill="#272A2D" text-anchor="start">24 ART UNITS · NO PER-RECIPE IMAGE REQUIREMENT · 0 ANIMATION FRAMES</text><text x="32" y="802" font-family="Arial" font-size="17" font-weight="400" fill="#272A2D" text-anchor="start">Offline allowance: 256–512KiB compressed incremental art, including all 24 units.</text><text x="32" y="833" font-family="Arial" font-size="17" font-weight="400" fill="#272A2D" text-anchor="start">Decoded raster fallback: 2 strips at 1024×256 + 22 images at 128×128 ≈ 3.4MiB RGBA.</text><text x="32" y="864" font-family="Arial" font-size="17" font-weight="400" fill="#272A2D" text-anchor="start">Allow 8MiB working memory including duplicate decodes and renderer overhead.</text><text x="32" y="895" font-family="Arial" font-size="17" font-weight="400" fill="#272A2D" text-anchor="start">Simple SVGs may be smaller on disk; browser/GPU memory still needs measurement.</text><text x="32" y="926" font-family="Arial" font-size="17" font-weight="400" fill="#272A2D" text-anchor="start">Fonts: system stack, 0 bundled bytes initially. No remote assets, fonts or image calls.</text><text x="32" y="957" font-family="Arial" font-size="17" font-weight="400" fill="#272A2D" text-anchor="start">A0: 14 authored symbols; remaining setting and actors use text + 2D primitives.</text><text x="32" y="1023" font-family="Arial" font-size="16" font-weight="400" fill="#272A2D" text-anchor="start">Scope change from ART-001: focused 14-symbol study replaces the earlier 20-symbol allowance.</text><text x="32" y="1051" font-family="Arial" font-size="16" font-weight="400" fill="#272A2D" text-anchor="start">No 3D, lighting pipeline, parallax, renderer migration or extra simulation fields are required.</text></svg>