name: SIM-002B foundation
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run dev -- --port 4178 --host 127.0.0.1 > /tmp/dev.log 2>&1 &
          npm run preview -- --port 4179 --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          node -e "async function wait(url){for(let i=0;i<100;i++){try{if((await fetch(url)).ok)return}catch{}await new Promise(r=>setTimeout(r,200))}throw Error(url)};await Promise.all([wait('http://127.0.0.1:4178'),wait('http://127.0.0.1:4179')])"
      - run: npm run test:browser && npm run test:replacement && npm run test:negative && npm run test:offline
      - run: npx tsx scripts/remediation-browser.ts
        env:
          TEST_URL: http://127.0.0.1:4179
          ALLOW_SERVICE_WORKERS: '1'
          EVIDENCE_DIR: artifacts/sim002b/production-remediation
      - run: npx tsx scripts/run_sim_002b.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim002b-builder-evidence
          path: |
            artifacts/sim002b/*.json
            artifacts/sim002b/*.gz
            artifacts/sim002b/*.png
            artifacts/sim002b/*.log
            artifacts/sim002b/campaigns/*
            artifacts/sim002b/raid/*
            artifacts/sim002b/remediation/*
            artifacts/sim002b/production-remediation/*
            artifacts/paid-replacement/*.json
            artifacts/paid-replacement/*.png
